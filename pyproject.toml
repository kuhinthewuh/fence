[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fence-evidence-mcp"
version = "0.1.0"
description = "Statistical evidence-sufficiency MCP server with class-conditional split conformal prediction and conservative abstention."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Fence Contributors" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "conformal-prediction",
    "rag",
    "evidence-sufficiency",
    "calibration",
    "abstention",
    "safety",
    "evaluation",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
fence-evidence-mcp = "fence_evidence.server:main"

[project.urls]
Homepage = "https://github.com/fence-ai/fence"
Documentation = "https://github.com/fence-ai/fence#readme"
Repository = "https://github.com/fence-ai/fence"
Issues = "https://github.com/fence-ai/fence/issues"
Changelog = "https://github.com/fence-ai/fence/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
