name: Package Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Validate Distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build sdist and wheel
      run: |
        python -m build

    - name: Validate distribution with Twine
      run: |
        python -m twine check --strict dist/*

    - name: Test wheel installation in fresh environment
      run: |
        python -m venv .clean_env
        .clean_env/bin/python -m pip install --upgrade pip
        .clean_env/bin/python -m pip install dist/*.whl
        .clean_env/bin/fence-evidence-mcp --version
        .clean_env/bin/python -c "import fence_evidence; print('Verified import:', fence_evidence.__version__)"

